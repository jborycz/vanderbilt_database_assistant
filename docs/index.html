<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanderbilt Database Assistant</title>
  <style>
    :root {
      --gold: #CFAE70;
      --dark-gold: #7A6030;
      --black: #1B1B1B;
      --white: #FFFFFF;
      --bg: #F4F3EF;
      --sidebar-bg: #FAF9F5;
      --border: #DDDBD4;
      --muted: #666;
      --code-bg: #F0EDE6;
      --hover: #EFEBDF;
      --active: #FBF6EA;
      --error-bg: #FEF2F2;
      --error-border: #FCA5A5;
      --error-text: #991B1B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--black);
      height: 100dvh;
      overflow: hidden;
    }

    /* ── App layout ── */
    .app {
      display: flex;
      height: 100dvh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .sidebar-head {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .new-chat-btn {
      width: 100%;
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background 0.15s, color 0.15s;
    }
    .new-chat-btn:hover { background: var(--dark-gold); color: var(--white); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-list-empty {
      padding: 0.8rem 0.6rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      font-style: italic;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
      position: relative;
    }
    .chat-row:hover { background: var(--hover); }
    .chat-row.active {
      background: var(--active);
      border-left: 3px solid var(--gold);
      padding-left: calc(0.6rem - 3px);
    }

    .chat-title {
      flex: 1;
      font-size: 0.85rem;
      color: var(--black);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-title.active-title { font-weight: 600; color: var(--dark-gold); }

    .chat-title-input {
      flex: 1;
      font-size: 0.85rem;
      font-family: inherit;
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 0.15rem 0.35rem;
      background: var(--white);
      outline: none;
      color: var(--black);
      min-width: 0;
    }

    .chat-actions {
      display: none;
      gap: 0.15rem;
      flex-shrink: 0;
    }
    .chat-row:hover .chat-actions,
    .chat-row.active .chat-actions {
      display: flex;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
      font-size: 0.85rem;
      line-height: 1;
      transition: color 0.1s, background 0.1s;
    }
    .icon-btn:hover { color: var(--dark-gold); background: var(--white); }
    .icon-btn.danger:hover { color: var(--error-text); }

    /* ── Sidebar backdrop (mobile) ── */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 15;
    }

    /* ── Main pane ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Header ── */
    header {
      background: var(--black);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      border-bottom: 3px solid var(--gold);
      flex-shrink: 0;
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      color: var(--gold);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 0.3rem;
      line-height: 1;
    }
    .hamburger:hover { color: var(--white); }

    .logo {
      width: 38px;
      height: 38px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--black);
      flex-shrink: 0;
      user-select: none;
    }

    header h1 { font-size: 1rem; font-weight: 600; color: var(--gold); letter-spacing: 0.01em; }
    header p  { font-size: 0.75rem; color: #999; margin-top: 0.1rem; }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    /* ── Welcome card ── */
    .welcome {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 1.1rem 1.25rem 1rem;
      align-self: center;
      max-width: 620px;
      width: 100%;
      text-align: center;
    }

    .welcome h2 { font-size: 0.95rem; color: var(--dark-gold); margin-bottom: 0.4rem; }
    .welcome p  { font-size: 0.85rem; color: var(--muted); line-height: 1.55; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      margin-top: 0.8rem;
    }

    .chip {
      background: none;
      border: 1px solid var(--gold);
      color: var(--dark-gold);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .chip:hover { background: var(--gold); color: var(--black); }

    /* ── User bubble ── */
    .bubble.user {
      background: var(--black);
      color: var(--white);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      max-width: 82%;
      padding: 0.65rem 0.9rem;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.9rem;
      word-break: break-word;
    }

    /* ── Result set ── */
    .result-set {
      align-self: stretch;
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .enhanced-query {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--black);
    }
    .enhanced-query .label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--dark-gold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .fallback-link {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
      padding: 0.35rem 0.2rem 0;
    }
    .fallback-link a {
      color: var(--dark-gold);
      text-decoration: underline;
    }
    .fallback-link a:hover { color: var(--black); }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--gold);
      color: var(--black);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transform: translateY(2px);
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
    }
    .card-name:hover { color: var(--dark-gold); text-decoration: underline; }
    .card-name .ext {
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: 0.25rem;
    }

    .card-desc { font-size: 0.85rem; color: var(--black); line-height: 1.5; }
    .card-why {
      font-size: 0.83rem;
      color: var(--dark-gold);
      line-height: 1.5;
      font-style: italic;
    }

    .search-block {
      background: var(--code-bg);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .search-block code {
      flex: 1;
      font-size: 0.8rem;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .copy-btn:hover { border-color: var(--dark-gold); color: var(--dark-gold); }
    .copy-btn.copied { border-color: var(--gold); color: var(--dark-gold); background: #FBF6EA; }

    .actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .action-btn {
      background: var(--gold);
      color: var(--black);
      text-decoration: none;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }
    .action-btn:hover { background: var(--dark-gold); color: var(--white); }
    .action-btn.secondary {
      background: transparent;
      color: var(--dark-gold);
      border: 1px solid var(--gold);
    }
    .action-btn.secondary:hover { background: var(--gold); color: var(--black); }

    .unmatched-note {
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 0.65rem 0.9rem;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      align-self: flex-start;
      width: fit-content;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--gold);
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-7px); }
    }

    /* ── Error banner ── */
    .error-banner {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      align-self: stretch;
      max-width: 780px;
      margin: 0 auto;
      line-height: 1.45;
    }

    /* ── Input area ── */
    #input-area {
      padding: 0.75rem 1rem;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      padding: 0.55rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      max-height: 140px;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.15s;
      background: var(--bg);
    }
    #user-input:focus { border-color: var(--gold); background: var(--white); }

    #send-btn {
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #send-btn:hover    { background: var(--dark-gold); color: var(--white); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100dvh;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
      }
      .app.sidebar-open .sidebar { transform: translateX(0); }
      .app.sidebar-open .sidebar-backdrop { display: block; }
      .hamburger { display: block; }
    }

    @media (max-width: 540px) {
      .bubble.user { max-width: 96%; }
      .card-head { align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="new-chat-btn" id="new-chat-btn" type="button">
        <span aria-hidden="true">+</span> New chat
      </button>
    </div>
    <div class="chat-list" id="chat-list"></div>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header>
      <button class="hamburger" id="hamburger" type="button" aria-label="Toggle chat history">☰</button>
      <div class="logo">V</div>
      <div>
        <h1>Vanderbilt Database Assistant</h1>
        <p>AI-powered research database suggestions</p>
      </div>
    </header>

    <div id="messages"></div>

    <div id="input-area">
      <textarea id="user-input" placeholder="Describe your research topic…" rows="1"></textarea>
      <button id="send-btn" type="button">Send</button>
    </div>
  </div>

</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  const BACKEND_URL = (["localhost", "127.0.0.1"].includes(location.hostname))
    ? "http://localhost:8000"
    : "https://vanderbilt-database-assistant.onrender.com";

  const STORAGE_KEY = "vdba.chats.v1";
  const MAX_TITLE_LEN = 48;
  const SUGGESTIONS = [
    "Mental health interventions",
    "Climate change policy",
    "Machine learning in medicine",
    "Civil War primary sources",
    "Economic inequality data",
  ];
  // ────────────────────────────────────────────────────────────────────────────

  const appEl        = document.getElementById("app");
  const sidebarEl    = document.getElementById("sidebar");
  const backdropEl   = document.getElementById("sidebar-backdrop");
  const chatListEl   = document.getElementById("chat-list");
  const newChatBtn   = document.getElementById("new-chat-btn");
  const hamburgerBtn = document.getElementById("hamburger");
  const messagesEl   = document.getElementById("messages");
  const inputEl      = document.getElementById("user-input");
  const sendBtn      = document.getElementById("send-btn");

  // ── Storage ────────────────────────────────────────────────────────────────
  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { chats: {}, active_id: null };
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") throw new Error("bad store");
      return { chats: parsed.chats || {}, active_id: parsed.active_id || null };
    } catch {
      return { chats: {}, active_id: null };
    }
  }

  function saveStore() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }

  let store = loadStore();

  // ── Chat model ─────────────────────────────────────────────────────────────
  function newId() {
    return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function createChat() {
    const id = newId();
    const chat = {
      id,
      title: "New chat",
      created_at: Date.now(),
      updated_at: Date.now(),
      turns: [],
    };
    store.chats[id] = chat;
    store.active_id = id;
    saveStore();
    return chat;
  }

  function activeChat() {
    if (store.active_id && store.chats[store.active_id]) return store.chats[store.active_id];
    return null;
  }

  function ensureActiveChat() {
    let chat = activeChat();
    if (!chat) chat = createChat();
    return chat;
  }

  function deleteChat(id) {
    if (!store.chats[id]) return;
    delete store.chats[id];
    if (store.active_id === id) {
      const remaining = sortedChats();
      store.active_id = remaining.length ? remaining[0].id : null;
    }
    saveStore();
  }

  function renameChat(id, title) {
    const chat = store.chats[id];
    if (!chat) return;
    title = title.trim().slice(0, 80);
    if (!title) return;
    chat.title = title;
    chat.updated_at = Date.now();
    saveStore();
  }

  function sortedChats() {
    return Object.values(store.chats).sort((a, b) => b.updated_at - a.updated_at);
  }

  function autoTitleFrom(text) {
    const clean = text.trim().replace(/\s+/g, " ");
    return clean.length > MAX_TITLE_LEN ? clean.slice(0, MAX_TITLE_LEN - 1) + "…" : clean;
  }

  function apiMessages(chat) {
    return chat.turns.map(t => t.role === "user"
      ? { role: "user", content: t.text }
      : { role: "assistant", content: t.payload.raw_assistant_message || JSON.stringify(t.payload) });
  }

  // ── DOM helpers ────────────────────────────────────────────────────────────
  function el(tag, opts = {}, ...children) {
    const node = document.createElement(tag);
    if (opts.className) node.className = opts.className;
    if (opts.text)      node.textContent = opts.text;
    if (opts.html)      node.innerHTML = opts.html;
    if (opts.href)      node.href = opts.href;
    if (opts.target)    node.target = opts.target;
    if (opts.rel)       node.rel = opts.rel;
    if (opts.title)     node.title = opts.title;
    if (opts.onClick)   node.addEventListener("click", opts.onClick);
    for (const c of children) if (c) node.appendChild(c);
    return node;
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Sidebar rendering ──────────────────────────────────────────────────────
  function renderChatList() {
    chatListEl.innerHTML = "";
    const chats = sortedChats();
    if (chats.length === 0) {
      chatListEl.appendChild(el("div", { className: "chat-list-empty", text: "No chats yet." }));
      return;
    }
    for (const chat of chats) {
      chatListEl.appendChild(renderChatRow(chat));
    }
  }

  function renderChatRow(chat) {
    const isActive = chat.id === store.active_id;
    const row = el("div", {
      className: "chat-row" + (isActive ? " active" : ""),
      title: chat.title,
    });
    row.dataset.chatId = chat.id;

    const titleEl = el("div", {
      className: "chat-title" + (isActive ? " active-title" : ""),
      text: chat.title,
    });
    titleEl.addEventListener("click", (e) => {
      // Don't switch when clicking action buttons.
      if (e.target.closest(".chat-actions")) return;
      switchToChat(chat.id);
    });

    const renameBtn = el("button", {
      className: "icon-btn",
      title: "Rename",
      html: "&#9998;", // pencil
    });
    renameBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      startRename(row, chat);
    });

    const delBtn = el("button", {
      className: "icon-btn danger",
      title: "Delete",
      html: "&#128465;", // trash
    });
    delBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      confirmDelete(chat);
    });

    const actions = el("div", { className: "chat-actions" }, renameBtn, delBtn);

    row.appendChild(titleEl);
    row.appendChild(actions);
    return row;
  }

  function startRename(row, chat) {
    const titleEl = row.querySelector(".chat-title");
    if (!titleEl) return;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "chat-title-input";
    input.value = chat.title;
    input.maxLength = 80;
    row.replaceChild(input, titleEl);
    input.focus();
    input.select();

    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      if (commit && input.value.trim()) {
        renameChat(chat.id, input.value);
      }
      renderChatList();
    };
    input.addEventListener("blur", () => finish(true));
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
  }

  function confirmDelete(chat) {
    if (!confirm(`Delete “${chat.title}”?`)) return;
    deleteChat(chat.id);
    renderChatList();
    renderActiveChat();
  }

  // ── Chat body rendering ────────────────────────────────────────────────────
  function renderWelcome() {
    const welcome = el("div", { className: "welcome" });
    welcome.appendChild(el("h2", { text: "Find the right database for your research" }));
    welcome.appendChild(el("p", { text: "Describe your research topic and I'll recommend five Vanderbilt Libraries databases with ready-to-paste search strings." }));
    const suggestions = el("div", { className: "suggestions" });
    for (const s of SUGGESTIONS) {
      const chip = el("button", {
        className: "chip",
        text: s,
        onClick: () => { inputEl.value = s; sendMessage(); },
      });
      suggestions.appendChild(chip);
    }
    welcome.appendChild(suggestions);
    messagesEl.appendChild(welcome);
  }

  function renderUserBubble(text) {
    messagesEl.appendChild(el("div", { className: "bubble user", text }));
  }

  function renderCard(rec, i) {
    const badge = el("span", { className: "badge", text: String(i + 1) });

    let nameNode;
    if (rec.direct_url) {
      nameNode = el("a", {
        className: "card-name",
        href: rec.direct_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: rec.name,
      });
      nameNode.appendChild(el("span", { className: "ext", text: "↗" }));
    } else {
      nameNode = el("span", { className: "card-name", text: rec.name });
    }

    const head = el("div", { className: "card-head" }, badge, nameNode);
    if (!rec.matched) {
      head.appendChild(el("span", {
        className: "unmatched-note",
        text: "(not found in current catalog)",
      }));
    }

    const desc = el("div", { className: "card-desc", text: rec.refined_description });
    const why  = el("div", { className: "card-why",  text: rec.why_it_fits });

    const codeEl = el("code", { text: rec.search_string || "" });
    const copyBtn = el("button", {
      className: "copy-btn",
      text: "Copy",
      onClick: async () => {
        try {
          await navigator.clipboard.writeText(rec.search_string || "");
          copyBtn.textContent = "Copied";
          copyBtn.classList.add("copied");
          setTimeout(() => {
            copyBtn.textContent = "Copy";
            copyBtn.classList.remove("copied");
          }, 1400);
        } catch {
          copyBtn.textContent = "Failed";
        }
      },
    });
    const searchBlock = el("div", { className: "search-block" }, codeEl, copyBtn);

    const actions = el("div", { className: "actions" });
    if (rec.primo_search_url) {
      actions.appendChild(el("a", {
        className: "action-btn",
        href: rec.primo_search_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: "Search in Primo",
      }));
    }
    if (rec.direct_url) {
      actions.appendChild(el("a", {
        className: "action-btn secondary",
        href: rec.direct_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: "Open database",
      }));
    }

    return el("div", { className: "card" }, head, desc, why, searchBlock, actions);
  }

  function renderResultSet(payload) {
    const wrap = el("div", { className: "result-set" });
    if (payload.enhanced_query) {
      const eq = el("div", { className: "enhanced-query" });
      eq.appendChild(el("span", { className: "label", text: "Interpreted query" }));
      eq.appendChild(document.createTextNode(payload.enhanced_query));
      wrap.appendChild(eq);
    }
    const fallback = el("div", { className: "fallback-link" });
    fallback.appendChild(document.createTextNode("If a link below doesn't work, browse the full "));
    fallback.appendChild(el("a", {
      href: "https://researchguides.library.vanderbilt.edu/az/databases",
      target: "_blank",
      rel: "noopener noreferrer",
      text: "Databases A-Z list",
    }));
    fallback.appendChild(document.createTextNode("."));
    wrap.appendChild(fallback);
    (payload.recommendations || []).forEach((rec, i) => {
      wrap.appendChild(renderCard(rec, i));
    });
    messagesEl.appendChild(wrap);
  }

  function renderActiveChat() {
    messagesEl.innerHTML = "";
    const chat = activeChat();
    if (!chat || chat.turns.length === 0) {
      renderWelcome();
      return;
    }
    for (const turn of chat.turns) {
      if (turn.role === "user") renderUserBubble(turn.text);
      else renderResultSet(turn.payload);
    }
    scrollBottom();
  }

  // ── Chat operations ────────────────────────────────────────────────────────
  function switchToChat(id) {
    if (store.active_id === id) return;
    store.active_id = id;
    saveStore();
    renderChatList();
    renderActiveChat();
    closeSidebarMobile();
  }

  function createChatAndSwitch() {
    createChat();
    renderChatList();
    renderActiveChat();
    inputEl.focus();
    closeSidebarMobile();
  }

  // ── Sidebar mobile toggle ──────────────────────────────────────────────────
  function openSidebarMobile()  { appEl.classList.add("sidebar-open"); }
  function closeSidebarMobile() { appEl.classList.remove("sidebar-open"); }
  function toggleSidebarMobile() { appEl.classList.toggle("sidebar-open"); }

  hamburgerBtn.addEventListener("click", toggleSidebarMobile);
  backdropEl.addEventListener("click", closeSidebarMobile);
  newChatBtn.addEventListener("click", createChatAndSwitch);
  sendBtn.addEventListener("click", sendMessage);

  // ── Input handling ─────────────────────────────────────────────────────────
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Send message ───────────────────────────────────────────────────────────
  function appendError(msg) {
    messagesEl.appendChild(el("div", { className: "error-banner", text: msg }));
    scrollBottom();
  }

  function appendTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    const chat = ensureActiveChat();
    const firstMessage = chat.turns.length === 0;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    // Remove welcome card if it's still there
    const welcomeEl = messagesEl.querySelector(".welcome");
    if (welcomeEl) welcomeEl.remove();

    // Optimistically append user bubble
    renderUserBubble(text);
    chat.turns.push({ role: "user", text });
    chat.updated_at = Date.now();
    if (firstMessage) chat.title = autoTitleFrom(text);
    saveStore();
    renderChatList();
    scrollBottom();

    const typing = appendTyping();

    try {
      const res = await fetch(`${BACKEND_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages(chat) }),
      });

      typing.remove();

      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error(`Server returned ${res.status}${body ? `: ${body.slice(0, 200)}` : ""}`);
      }

      const payload = await res.json();
      renderResultSet(payload);
      scrollBottom();

      chat.turns.push({ role: "assistant", payload });
      chat.updated_at = Date.now();
      saveStore();
      renderChatList();

    } catch (err) {
      typing.remove();
      appendError(`Something went wrong: ${err.message}. The server may be waking up from sleep — please wait a moment and try again.`);
      // Roll back the optimistic user turn since we got no response.
      chat.turns.pop();
      if (firstMessage) chat.title = "New chat";
      saveStore();
      renderChatList();
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  ensureActiveChat();
  renderChatList();
  renderActiveChat();
  inputEl.focus();
</script>

</body>
</html>
