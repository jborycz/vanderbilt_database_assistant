<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanderbilt Database Assistant</title>
  <style>
    :root {
      --gold: #CFAE70;
      --dark-gold: #7A6030;
      --black: #1B1B1B;
      --white: #FFFFFF;
      --bg: #F4F3EF;
      --border: #DDDBD4;
      --muted: #666;
      --code-bg: #F0EDE6;
      --error-bg: #FEF2F2;
      --error-border: #FCA5A5;
      --error-text: #991B1B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--black);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--black);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      border-bottom: 3px solid var(--gold);
      flex-shrink: 0;
    }

    .logo {
      width: 38px;
      height: 38px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--black);
      flex-shrink: 0;
      user-select: none;
    }

    header h1 { font-size: 1rem; font-weight: 600; color: var(--gold); letter-spacing: 0.01em; }
    header p  { font-size: 0.75rem; color: #999; margin-top: 0.1rem; }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    /* ── Welcome card ── */
    .welcome {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 1.1rem 1.25rem 1rem;
      align-self: center;
      max-width: 620px;
      width: 100%;
      text-align: center;
    }

    .welcome h2 { font-size: 0.95rem; color: var(--dark-gold); margin-bottom: 0.4rem; }
    .welcome p  { font-size: 0.85rem; color: var(--muted); line-height: 1.55; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      margin-top: 0.8rem;
    }

    .chip {
      background: none;
      border: 1px solid var(--gold);
      color: var(--dark-gold);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .chip:hover { background: var(--gold); color: var(--black); }

    /* ── User bubble ── */
    .bubble.user {
      background: var(--black);
      color: var(--white);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      max-width: 82%;
      padding: 0.65rem 0.9rem;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.9rem;
      word-break: break-word;
    }

    /* ── Result set ── */
    .result-set {
      align-self: stretch;
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .enhanced-query {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--black);
    }
    .enhanced-query .label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--dark-gold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--gold);
      color: var(--black);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transform: translateY(2px);
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
    }
    .card-name:hover { color: var(--dark-gold); text-decoration: underline; }
    .card-name .ext {
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: 0.25rem;
    }

    .card-desc { font-size: 0.85rem; color: var(--black); line-height: 1.5; }
    .card-why {
      font-size: 0.83rem;
      color: var(--dark-gold);
      line-height: 1.5;
      font-style: italic;
    }

    .search-block {
      background: var(--code-bg);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .search-block code {
      flex: 1;
      font-size: 0.8rem;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .copy-btn:hover { border-color: var(--dark-gold); color: var(--dark-gold); }
    .copy-btn.copied { border-color: var(--gold); color: var(--dark-gold); background: #FBF6EA; }

    .actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .action-btn {
      background: var(--gold);
      color: var(--black);
      text-decoration: none;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }
    .action-btn:hover { background: var(--dark-gold); color: var(--white); }
    .action-btn.secondary {
      background: transparent;
      color: var(--dark-gold);
      border: 1px solid var(--gold);
    }
    .action-btn.secondary:hover { background: var(--gold); color: var(--black); }

    .unmatched-note {
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 0.65rem 0.9rem;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      align-self: flex-start;
      width: fit-content;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--gold);
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-7px); }
    }

    /* ── Error banner ── */
    .error-banner {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      align-self: stretch;
      max-width: 780px;
      margin: 0 auto;
      line-height: 1.45;
    }

    /* ── Input area ── */
    #input-area {
      padding: 0.75rem 1rem;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      padding: 0.55rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      max-height: 140px;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.15s;
      background: var(--bg);
    }
    #user-input:focus { border-color: var(--gold); background: var(--white); }

    #send-btn {
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #send-btn:hover    { background: var(--dark-gold); color: var(--white); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    @media (max-width: 540px) {
      .bubble.user { max-width: 96%; }
      .card-head { align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">V</div>
  <div>
    <h1>Vanderbilt Database Assistant</h1>
    <p>AI-powered research database suggestions</p>
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome-card">
    <h2>Find the right database for your research</h2>
    <p>Describe your research topic and I'll recommend five Vanderbilt Libraries databases with ready-to-paste search strings.</p>
    <div class="suggestions">
      <button class="chip" onclick="useSuggestion(this)">Mental health interventions</button>
      <button class="chip" onclick="useSuggestion(this)">Climate change policy</button>
      <button class="chip" onclick="useSuggestion(this)">Machine learning in medicine</button>
      <button class="chip" onclick="useSuggestion(this)">Civil War primary sources</button>
      <button class="chip" onclick="useSuggestion(this)">Economic inequality data</button>
    </div>
  </div>
</div>

<div id="input-area">
  <textarea id="user-input" placeholder="Describe your research topic…" rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  // When served from localhost, hit the local backend; otherwise use the Render deploy.
  const BACKEND_URL = (["localhost", "127.0.0.1"].includes(location.hostname))
    ? "http://localhost:8000"
    : "https://vanderbilt-database-assistant.onrender.com";
  // ────────────────────────────────────────────────────────────────────────────

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");
  const history    = [];

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function useSuggestion(btn) {
    inputEl.value = btn.textContent.trim();
    sendMessage();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function el(tag, opts = {}, ...children) {
    const node = document.createElement(tag);
    if (opts.className) node.className = opts.className;
    if (opts.text)      node.textContent = opts.text;
    if (opts.html)      node.innerHTML = opts.html;
    if (opts.href)      node.href = opts.href;
    if (opts.target)    node.target = opts.target;
    if (opts.rel)       node.rel = opts.rel;
    if (opts.onClick)   node.addEventListener("click", opts.onClick);
    for (const c of children) if (c) node.appendChild(c);
    return node;
  }

  function appendUserBubble(text) {
    const div = el("div", { className: "bubble user", text });
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function appendTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function appendError(msg) {
    const div = el("div", { className: "error-banner", text: msg });
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function renderCard(rec, i) {
    const badge = el("span", { className: "badge", text: String(i + 1) });

    let nameNode;
    if (rec.direct_url) {
      nameNode = el("a", {
        className: "card-name",
        href: rec.direct_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: rec.name,
      });
      nameNode.appendChild(el("span", { className: "ext", text: "↗" }));
    } else {
      nameNode = el("span", { className: "card-name", text: rec.name });
    }

    const head = el("div", { className: "card-head" }, badge, nameNode);
    if (!rec.matched) {
      head.appendChild(el("span", {
        className: "unmatched-note",
        text: "(not found in current catalog)",
      }));
    }

    const desc = el("div", { className: "card-desc", text: rec.refined_description });
    const why  = el("div", { className: "card-why",  text: rec.why_it_fits });

    const codeEl = el("code", { text: rec.search_string || "" });
    const copyBtn = el("button", {
      className: "copy-btn",
      text: "Copy",
      onClick: async () => {
        try {
          await navigator.clipboard.writeText(rec.search_string || "");
          copyBtn.textContent = "Copied";
          copyBtn.classList.add("copied");
          setTimeout(() => {
            copyBtn.textContent = "Copy";
            copyBtn.classList.remove("copied");
          }, 1400);
        } catch {
          copyBtn.textContent = "Failed";
        }
      },
    });
    const searchBlock = el("div", { className: "search-block" }, codeEl, copyBtn);

    const actions = el("div", { className: "actions" });
    if (rec.primo_search_url) {
      actions.appendChild(el("a", {
        className: "action-btn",
        href: rec.primo_search_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: "Search in Primo",
      }));
    }
    if (rec.direct_url) {
      actions.appendChild(el("a", {
        className: "action-btn secondary",
        href: rec.direct_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: "Open database",
      }));
    }

    return el("div", { className: "card" }, head, desc, why, searchBlock, actions);
  }

  function renderResultSet(payload) {
    const wrap = el("div", { className: "result-set" });

    if (payload.enhanced_query) {
      const eq = el("div", { className: "enhanced-query" });
      eq.appendChild(el("span", { className: "label", text: "Interpreted query" }));
      eq.appendChild(document.createTextNode(payload.enhanced_query));
      wrap.appendChild(eq);
    }

    (payload.recommendations || []).forEach((rec, i) => {
      wrap.appendChild(renderCard(rec, i));
    });

    messagesEl.appendChild(wrap);
    scrollBottom();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    document.getElementById("welcome-card")?.remove();

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    appendUserBubble(text);
    history.push({ role: "user", content: text });

    const typing = appendTyping();

    try {
      const res = await fetch(`${BACKEND_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });

      typing.remove();

      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error(`Server returned ${res.status}${body ? `: ${body.slice(0, 200)}` : ""}`);
      }

      const payload = await res.json();
      renderResultSet(payload);

      // Push the raw assistant message so multi-turn context is preserved.
      history.push({
        role: "assistant",
        content: payload.raw_assistant_message || JSON.stringify(payload),
      });

    } catch (err) {
      typing.remove();
      appendError(`Something went wrong: ${err.message}. The server may be waking up from sleep — please wait a moment and try again.`);
      history.pop(); // undo the user message since we got no response
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>

</body>
</html>
