<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanderbilt Database Assistant</title>
  <style>
    :root {
      --gold: #CFAE70;
      --dark-gold: #7A6030;
      --black: #1B1B1B;
      --white: #FFFFFF;
      --bg: #F4F3EF;
      --sidebar-bg: #FAF9F5;
      --border: #DDDBD4;
      --muted: #666;
      --code-bg: #F0EDE6;
      --hover: #EFEBDF;
      --active: #FBF6EA;
      --error-bg: #FEF2F2;
      --error-border: #FCA5A5;
      --error-text: #991B1B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--black);
      height: 100dvh;
      overflow: hidden;
    }

    /* ── App layout ── */
    .app {
      display: flex;
      height: 100dvh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .sidebar-head {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .new-chat-btn {
      width: 100%;
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background 0.15s, color 0.15s;
    }
    .new-chat-btn:hover { background: var(--dark-gold); color: var(--white); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-list-empty {
      padding: 0.8rem 0.6rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      font-style: italic;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
      position: relative;
    }
    .chat-row:hover { background: var(--hover); }
    .chat-row.active {
      background: var(--active);
      border-left: 3px solid var(--gold);
      padding-left: calc(0.6rem - 3px);
    }

    .chat-title {
      flex: 1;
      font-size: 0.85rem;
      color: var(--black);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-title.active-title { font-weight: 600; color: var(--dark-gold); }

    .chat-title-input {
      flex: 1;
      font-size: 0.85rem;
      font-family: inherit;
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 0.15rem 0.35rem;
      background: var(--white);
      outline: none;
      color: var(--black);
      min-width: 0;
    }

    .chat-actions {
      display: none;
      gap: 0.15rem;
      flex-shrink: 0;
    }
    .chat-row:hover .chat-actions,
    .chat-row.active .chat-actions {
      display: flex;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
      font-size: 0.85rem;
      line-height: 1;
      transition: color 0.1s, background 0.1s;
    }
    .icon-btn:hover { color: var(--dark-gold); background: var(--white); }
    .icon-btn.danger:hover { color: var(--error-text); }

    /* ── Sidebar backdrop (mobile) ── */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 15;
    }

    /* ── Main pane ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Header ── */
    header {
      background: var(--black);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      border-bottom: 3px solid var(--gold);
      flex-shrink: 0;
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      color: var(--gold);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 0.3rem;
      line-height: 1;
    }
    .hamburger:hover { color: var(--white); }

    .logo {
      width: 38px;
      height: 38px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--black);
      flex-shrink: 0;
      user-select: none;
    }

    header h1 { font-size: 1rem; font-weight: 600; color: var(--gold); letter-spacing: 0.01em; }
    header p  { font-size: 0.75rem; color: #999; margin-top: 0.1rem; }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    /* ── Welcome card ── */
    .welcome {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 1.1rem 1.25rem 1rem;
      align-self: center;
      max-width: 620px;
      width: 100%;
      text-align: center;
    }

    .welcome h2 { font-size: 0.95rem; color: var(--dark-gold); margin-bottom: 0.4rem; }
    .welcome p  { font-size: 0.85rem; color: var(--muted); line-height: 1.55; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      margin-top: 0.8rem;
    }

    .chip {
      background: none;
      border: 1px solid var(--gold);
      color: var(--dark-gold);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .chip:hover { background: var(--gold); color: var(--black); }

    /* ── User bubble ── */
    .bubble.user {
      background: var(--black);
      color: var(--white);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      max-width: 82%;
      padding: 0.65rem 0.9rem;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.9rem;
      word-break: break-word;
    }

    /* ── Assistant text bubble (chat-mode replies) ── */
    .bubble.assistant {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--black);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      max-width: 92%;
      padding: 0.65rem 0.9rem;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* ── Result set ── */
    .result-set {
      align-self: stretch;
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .enhanced-query {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--black);
    }
    .enhanced-query .label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--dark-gold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .fallback-link {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
      padding: 0.35rem 0.2rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .fallback-link a {
      color: var(--dark-gold);
      text-decoration: underline;
    }
    .fallback-link a:hover { color: var(--black); }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--gold);
      color: var(--black);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transform: translateY(2px);
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
    }
    .card-name:hover { color: var(--dark-gold); text-decoration: underline; }
    .card-name .ext {
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: 0.25rem;
    }

    .card-desc { font-size: 0.85rem; color: var(--black); line-height: 1.5; }
    .card-why {
      font-size: 0.83rem;
      color: var(--dark-gold);
      line-height: 1.5;
      font-style: italic;
    }

    .search-block {
      background: var(--code-bg);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .search-block code {
      flex: 1;
      font-size: 0.8rem;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .copy-btn:hover { border-color: var(--dark-gold); color: var(--dark-gold); }
    .copy-btn.copied { border-color: var(--gold); color: var(--dark-gold); background: #FBF6EA; }

    .actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .action-btn {
      background: var(--gold);
      color: var(--black);
      text-decoration: none;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }
    .action-btn:hover { background: var(--dark-gold); color: var(--white); }
    .action-btn.secondary {
      background: transparent;
      color: var(--dark-gold);
      border: 1px solid var(--gold);
    }
    .action-btn.secondary:hover { background: var(--gold); color: var(--black); }

    .unmatched-note {
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Ask a Librarian card ── */
    .librarian-card {
      background: #E8F2FC;
      border: 1px solid #B7D3EE;
      border-left: 4px solid #4A86C5;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .librarian-card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.7rem; }
    .librarian-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1F4E79;
    }
    .librarian-sub { font-size: 0.78rem; color: #4D6A85; }
    .librarian-list { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .librarian-person {
      flex: 1 1 245px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid #CFE1F4;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      font-size: 0.82rem;
      min-width: 0;
    }
    .librarian-name { font-weight: 600; color: var(--black); font-size: 0.9rem; }
    .librarian-title { color: #36546F; line-height: 1.3; }
    .librarian-details { display: flex; flex-direction: column; gap: 0.1rem; margin-top: 0.3rem; color: #36546F; overflow-wrap: break-word; }
    .librarian-details a, .librarian-links a { color: #1F5F9E; }
    .librarian-links { display: flex; flex-wrap: wrap; gap: 0.2rem 0.8rem; margin-top: 0.35rem; font-size: 0.78rem; }

    /* ── Toolbar (export/print/full-text) ── */
    #toolbar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.55rem 1.25rem;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .toolbar-btn {
      background: transparent;
      color: var(--dark-gold);
      border: 1px solid var(--border);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .toolbar-btn:hover { border-color: var(--gold); background: var(--white); }

    /* ── Sidebar sections ── */
    .chat-section-head {
      padding: 0.7rem 0.6rem 0.2rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dark-gold);
    }
    .chat-section-head:first-child { padding-top: 0.2rem; }

    /* ── Assistant switch ── */
    .mode-switch { margin-left: auto; display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .toolbar-btn.active { background: var(--gold); border-color: var(--gold); color: var(--black); font-weight: 600; }

    /* ── Open Access journal cards ── */
    .oa-note {
      background: #FFF7E6;
      border: 1px solid #EBD9A8;
      color: #6B5521;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .oa-badges { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .oa-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
    }
    .oa-badge.good { background: #E7F4EA; border-color: #B9DDC1; color: #1F6B33; }
    .oa-badge.ok   { background: #EAF2FB; border-color: #BCD3EE; color: #1F5F9E; }
    .oa-badge.warn { background: #FDECEA; border-color: #F0C2BD; color: #9A2B22; }
    .oa-fact { font-size: 0.82rem; color: var(--black); line-height: 1.45; }
    .oa-fact.muted { color: var(--muted); font-size: 0.78rem; }
    .oa-disclaimer { font-size: 0.74rem; font-style: italic; color: var(--muted); margin-top: 0.3rem; }

    /* ── Export menu ── */
    .export-menu { position: relative; }
    .export-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 190px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      padding: 0.25rem;
      z-index: 30;
    }
    .export-dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      font-size: 0.82rem;
      color: var(--black);
      cursor: pointer;
    }
    .export-dropdown button:hover,
    .export-dropdown button:focus-visible { background: var(--bg); outline: none; }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 0.65rem 0.9rem;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      align-self: flex-start;
      width: fit-content;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--gold);
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-7px); }
    }

    /* ── Error banner ── */
    .error-banner {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      align-self: stretch;
      max-width: 780px;
      margin: 0 auto;
      line-height: 1.45;
    }

    /* ── Input area ── */
    #input-area {
      padding: 0.75rem 1rem;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      padding: 0.55rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      max-height: 140px;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.15s;
      background: var(--bg);
    }
    #user-input:focus { border-color: var(--gold); background: var(--white); }

    #send-btn {
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #send-btn:hover    { background: var(--dark-gold); color: var(--white); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100dvh;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
      }
      .app.sidebar-open .sidebar { transform: translateX(0); }
      .app.sidebar-open .sidebar-backdrop { display: block; }
      .hamburger { display: block; }
    }

    @media (max-width: 540px) {
      .bubble.user { max-width: 96%; }
      .card-head { align-items: flex-start; }
    }

    /* ── Print ── */
    @media print {
      .sidebar, .sidebar-backdrop, .hamburger, #toolbar, #input-area {
        display: none !important;
      }
      body, .app, .main { background: #fff !important; }
      header { border-bottom: 1px solid #000; }
      .card, .bubble { break-inside: avoid; }
      #messages { overflow: visible !important; }
    }
  </style>
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="new-chat-btn" id="new-chat-btn" type="button">
        <span aria-hidden="true">+</span> New chat
      </button>
    </div>
    <div class="chat-list" id="chat-list"></div>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header>
      <button class="hamburger" id="hamburger" type="button" aria-label="Toggle chat history">☰</button>
      <div class="logo">V</div>
      <div>
        <h1 id="app-title">Vanderbilt Database Assistant</h1>
        <p id="app-subtitle">AI-powered research database suggestions</p>
      </div>
    </header>

    <div id="toolbar">
      <div class="export-menu" id="export-menu">
        <button class="toolbar-btn" id="export-btn" type="button" aria-haspopup="menu" aria-expanded="false">Export ▾</button>
        <div class="export-dropdown" id="export-dropdown" role="menu" hidden>
          <button id="export-copy-btn" type="button" role="menuitem">Copy as Markdown</button>
          <button id="export-download-btn" type="button" role="menuitem">Download .md</button>
          <button id="export-print-btn" type="button" role="menuitem">Print</button>
        </div>
      </div>
      <div class="mode-switch" role="group" aria-label="Choose assistant">
        <button class="toolbar-btn" id="mode-database-btn" type="button" aria-pressed="true">Database Assistant</button>
        <button class="toolbar-btn" id="mode-oa-btn" type="button" aria-pressed="false">Open Access Assistant</button>
      </div>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <textarea id="user-input" placeholder="Describe your research topic…" rows="1"></textarea>
      <button id="send-btn" type="button">Send</button>
    </div>
  </div>

</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  const BACKEND_URL = (["localhost", "127.0.0.1"].includes(location.hostname))
    ? "http://localhost:8000"
    : "https://sm5bgafvaz.us-east-1.awsapprunner.com";

  const STORAGE_KEY = "vdba.chats.v1";
  const MAX_TITLE_LEN = 48;
  const KINDS = {
    database: {
      title: "Vanderbilt Database Assistant",
      subtitle: "AI-powered research database suggestions",
      placeholder: "Describe your research topic…",
    },
    oa: {
      title: "Open Access Assistant",
      subtitle: "Journals with Vanderbilt open-access publishing agreements",
      placeholder: "Describe your manuscript, or name a similar journal…",
    },
  };
  const OA_SUGGESTIONS = [
    "Machine learning for early sepsis detection",
    "Journals similar to JAMA Network Open",
    "Fully open access journals in climate economics",
    "Top-quartile nursing journals with APC waivers",
  ];
  const OPEN_JOURNAL_FINDER_URL = "https://vanderbilt.openjournalfinder.com";
  const AUTHOR_SERVICES_URL = "https://researchguides.library.vanderbilt.edu/AuthorServices/vuoaagreements";
  const SUGGESTIONS = [
    "Mental health interventions",
    "Climate change policy",
    "Machine learning in medicine",
    "Civil War primary sources",
    "Economic inequality data",
  ];
  // ────────────────────────────────────────────────────────────────────────────

  const appEl        = document.getElementById("app");
  const sidebarEl    = document.getElementById("sidebar");
  const backdropEl   = document.getElementById("sidebar-backdrop");
  const chatListEl   = document.getElementById("chat-list");
  const newChatBtn   = document.getElementById("new-chat-btn");
  const hamburgerBtn = document.getElementById("hamburger");
  const messagesEl   = document.getElementById("messages");
  const inputEl      = document.getElementById("user-input");
  const sendBtn      = document.getElementById("send-btn");

  const appTitleEl        = document.getElementById("app-title");
  const appSubtitleEl     = document.getElementById("app-subtitle");
  const modeDatabaseBtn   = document.getElementById("mode-database-btn");
  const modeOaBtn         = document.getElementById("mode-oa-btn");
  const exportMenuEl      = document.getElementById("export-menu");
  const exportBtn         = document.getElementById("export-btn");
  const exportDropdownEl  = document.getElementById("export-dropdown");
  const exportCopyBtn     = document.getElementById("export-copy-btn");
  const exportDownloadBtn = document.getElementById("export-download-btn");
  const exportPrintBtn    = document.getElementById("export-print-btn");

  // ── Storage ────────────────────────────────────────────────────────────────
  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { chats: {}, active_id: null };
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") throw new Error("bad store");
      return { chats: parsed.chats || {}, active_id: parsed.active_id || null };
    } catch {
      return { chats: {}, active_id: null };
    }
  }

  function saveStore() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }

  let store = loadStore();

  // ── Chat model ─────────────────────────────────────────────────────────────
  function newId() {
    return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function kindOf(chat) {
    return chat && chat.kind === "oa" ? "oa" : "database";
  }

  function currentKind() {
    const chat = activeChat();
    return chat ? kindOf(chat) : "database";
  }

  function createChat(kind = currentKind()) {
    const id = newId();
    const chat = {
      id,
      kind,
      title: "New chat",
      created_at: Date.now(),
      updated_at: Date.now(),
      turns: [],
    };
    store.chats[id] = chat;
    store.active_id = id;
    saveStore();
    return chat;
  }

  function activeChat() {
    if (store.active_id && store.chats[store.active_id]) return store.chats[store.active_id];
    return null;
  }

  function ensureActiveChat() {
    let chat = activeChat();
    if (!chat) chat = createChat();
    return chat;
  }

  function deleteChat(id) {
    if (!store.chats[id]) return;
    const kind = kindOf(store.chats[id]);
    delete store.chats[id];
    if (store.active_id === id) {
      // Prefer another chat of the same assistant, else any chat.
      const all = sortedChats();
      const sameKind = all.filter(c => kindOf(c) === kind);
      const remaining = sameKind.length ? sameKind : all;
      store.active_id = remaining.length ? remaining[0].id : null;
    }
    saveStore();
  }

  function renameChat(id, title) {
    const chat = store.chats[id];
    if (!chat) return;
    title = title.trim().slice(0, 80);
    if (!title) return;
    chat.title = title;
    chat.updated_at = Date.now();
    saveStore();
  }

  function sortedChats() {
    return Object.values(store.chats).sort((a, b) => b.updated_at - a.updated_at);
  }

  function autoTitleFrom(text) {
    const clean = text.trim().replace(/\s+/g, " ");
    return clean.length > MAX_TITLE_LEN ? clean.slice(0, MAX_TITLE_LEN - 1) + "…" : clean;
  }

  function apiMessages(chat) {
    return chat.turns.map(t => {
      if (t.role === "user") return { role: "user", content: t.text };
      // Assistant turn: prefer the raw JSON we stored; fall back to a shape
      // compatible with either mode.
      let content = t.raw_assistant_message;
      if (!content) {
        if (t.mode === "chat") content = JSON.stringify({ mode: "chat", text: t.text || "" });
        else if (t.mode === "oa") content = JSON.stringify({ action: "recommend", recommended: ((t.payload || {}).journals || []).map(j => j.name) });
        else content = JSON.stringify(t.payload || {});
      }
      return { role: "assistant", content };
    });
  }

  // ── DOM helpers ────────────────────────────────────────────────────────────
  function el(tag, opts = {}, ...children) {
    const node = document.createElement(tag);
    if (opts.className) node.className = opts.className;
    if (opts.text)      node.textContent = opts.text;
    if (opts.html)      node.innerHTML = opts.html;
    if (opts.href)      node.href = opts.href;
    if (opts.target)    node.target = opts.target;
    if (opts.rel)       node.rel = opts.rel;
    if (opts.title)     node.title = opts.title;
    if (opts.onClick)   node.addEventListener("click", opts.onClick);
    for (const c of children) if (c) node.appendChild(c);
    return node;
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Sidebar rendering ──────────────────────────────────────────────────────
  function renderChatList() {
    chatListEl.innerHTML = "";
    const all = sortedChats();
    for (const kind of ["database", "oa"]) {
      chatListEl.appendChild(el("div", { className: "chat-section-head", text: KINDS[kind].title }));
      const chats = all.filter(c => kindOf(c) === kind);
      if (chats.length === 0) {
        chatListEl.appendChild(el("div", { className: "chat-list-empty", text: "No chats yet." }));
        continue;
      }
      for (const chat of chats) {
        chatListEl.appendChild(renderChatRow(chat));
      }
    }
  }

  function renderChatRow(chat) {
    const isActive = chat.id === store.active_id;
    const row = el("div", {
      className: "chat-row" + (isActive ? " active" : ""),
      title: chat.title,
    });
    row.dataset.chatId = chat.id;

    const titleEl = el("div", {
      className: "chat-title" + (isActive ? " active-title" : ""),
      text: chat.title,
    });
    titleEl.addEventListener("click", (e) => {
      // Don't switch when clicking action buttons.
      if (e.target.closest(".chat-actions")) return;
      switchToChat(chat.id);
    });

    const renameBtn = el("button", {
      className: "icon-btn",
      title: "Rename",
      html: "&#9998;", // pencil
    });
    renameBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      startRename(row, chat);
    });

    const delBtn = el("button", {
      className: "icon-btn danger",
      title: "Delete",
      html: "&#128465;", // trash
    });
    delBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      confirmDelete(chat);
    });

    const actions = el("div", { className: "chat-actions" }, renameBtn, delBtn);

    row.appendChild(titleEl);
    row.appendChild(actions);
    return row;
  }

  function startRename(row, chat) {
    const titleEl = row.querySelector(".chat-title");
    if (!titleEl) return;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "chat-title-input";
    input.value = chat.title;
    input.maxLength = 80;
    row.replaceChild(input, titleEl);
    input.focus();
    input.select();

    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      if (commit && input.value.trim()) {
        renameChat(chat.id, input.value);
      }
      renderChatList();
    };
    input.addEventListener("blur", () => finish(true));
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
  }

  function confirmDelete(chat) {
    if (!confirm(`Delete “${chat.title}”?`)) return;
    deleteChat(chat.id);
    renderChatList();
    renderActiveChat();
  }

  // ── Chat body rendering ────────────────────────────────────────────────────
  function renderWelcome() {
    const isOa = currentKind() === "oa";
    const welcome = el("div", { className: "welcome" });
    if (isOa) {
      welcome.appendChild(el("h2", { text: "Find a journal under Vanderbilt's open-access agreements" }));
      welcome.appendChild(el("p", { text: "Describe your manuscript, or name a journal you'd like something similar to. I'll match journals with a current Vanderbilt publisher agreement by scope, impact (SJR quartile), and the fee waiver or discount available." }));
    } else {
      welcome.appendChild(el("h2", { text: "Find the right database for your research" }));
      welcome.appendChild(el("p", { text: "Describe your research topic and I'll recommend five Vanderbilt Libraries databases with ready-to-paste search strings." }));
    }
    const suggestions = el("div", { className: "suggestions" });
    for (const s of (isOa ? OA_SUGGESTIONS : SUGGESTIONS)) {
      const chip = el("button", {
        className: "chip",
        text: s,
        onClick: () => { inputEl.value = s; sendMessage(); },
      });
      suggestions.appendChild(chip);
    }
    welcome.appendChild(suggestions);
    if (isOa) {
      const links = el("p", { className: "oa-disclaimer" });
      links.appendChild(document.createTextNode("Or browse the "));
      links.appendChild(el("a", { href: OPEN_JOURNAL_FINDER_URL, target: "_blank", rel: "noopener noreferrer", text: "Open Journal Finder" }));
      links.appendChild(document.createTextNode(" and read the "));
      links.appendChild(el("a", { href: AUTHOR_SERVICES_URL, target: "_blank", rel: "noopener noreferrer", text: "Vanderbilt Open Author Services guide" }));
      links.appendChild(document.createTextNode("."));
      welcome.appendChild(links);
    }
    messagesEl.appendChild(welcome);
  }

  function renderUserBubble(text) {
    messagesEl.appendChild(el("div", { className: "bubble user", text }));
  }

  function renderCard(rec, i) {
    const badge = el("span", { className: "badge", text: String(i + 1) });

    let nameNode;
    if (rec.direct_url) {
      nameNode = el("a", {
        className: "card-name",
        href: rec.direct_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: rec.name,
      });
      nameNode.appendChild(el("span", { className: "ext", text: "↗" }));
    } else {
      nameNode = el("span", { className: "card-name", text: rec.name });
    }

    const head = el("div", { className: "card-head" }, badge, nameNode);
    if (!rec.matched) {
      head.appendChild(el("span", {
        className: "unmatched-note",
        text: "(not found in current catalog)",
      }));
    }

    const desc = el("div", { className: "card-desc", text: rec.refined_description });
    const why  = el("div", { className: "card-why",  text: rec.why_it_fits });

    const codeEl = el("code", { text: rec.search_string || "" });
    const copyBtn = el("button", {
      className: "copy-btn",
      text: "Copy",
      onClick: async () => {
        try {
          await navigator.clipboard.writeText(rec.search_string || "");
          copyBtn.textContent = "Copied";
          copyBtn.classList.add("copied");
          setTimeout(() => {
            copyBtn.textContent = "Copy";
            copyBtn.classList.remove("copied");
          }, 1400);
        } catch {
          copyBtn.textContent = "Failed";
        }
      },
    });
    const searchBlock = el("div", { className: "search-block" }, codeEl, copyBtn);

    const actions = el("div", { className: "actions" });
    if (rec.primo_search_url) {
      actions.appendChild(el("a", {
        className: "action-btn",
        href: rec.primo_search_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: "Search in Primo",
      }));
    }
    if (rec.direct_url) {
      actions.appendChild(el("a", {
        className: "action-btn secondary",
        href: rec.direct_url,
        target: "_blank",
        rel: "noopener noreferrer",
        text: "Open database",
      }));
    }

    return el("div", { className: "card" }, head, desc, why, searchBlock, actions);
  }

  function safeHttpUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  function renderLibrarianCard(librarians) {
    const card = el("div", { className: "librarian-card" });
    const head = el("div", { className: "librarian-card-head" });
    head.appendChild(el("span", { className: "librarian-label", text: "Ask a Librarian" }));
    head.appendChild(el("span", { className: "librarian-sub", text: "Subject experts who can help with this topic" }));
    card.appendChild(head);

    const list = el("div", { className: "librarian-list" });
    for (const p of librarians) {
      const person = el("div", { className: "librarian-person" });
      person.appendChild(el("div", { className: "librarian-name", text: p.name }));
      person.appendChild(el("div", { className: "librarian-title", text: p.title }));

      const details = el("div", { className: "librarian-details" });
      if (p.email) details.appendChild(el("a", { href: `mailto:${p.email}`, text: p.email }));
      if (p.phone) details.appendChild(el("a", { href: `tel:${p.phone}`, text: p.phone }));
      const where = p.office || p.unit;
      if (where) details.appendChild(el("span", { text: where }));
      person.appendChild(details);

      const links = el("div", { className: "librarian-links" });
      const connect = safeHttpUrl(p.connect_url);
      const guides = safeHttpUrl(p.guides_url);
      if (connect) links.appendChild(el("a", { href: connect, target: "_blank", rel: "noopener noreferrer", text: "Office hours & appointments" }));
      if (guides)  links.appendChild(el("a", { href: guides,  target: "_blank", rel: "noopener noreferrer", text: "Research guides" }));
      if (links.children.length) person.appendChild(links);

      list.appendChild(person);
    }
    card.appendChild(list);
    return card;
  }

    const wrap = el("div", { className: "result-set" });
    if (payload.enhanced_query) {
      const eq = el("div", { className: "enhanced-query" });

    }
    const fallback = el("div", { className: "fallback-link" });

    azLine.appendChild(el("a", {
      href: "https://researchguides.library.vanderbilt.edu/az/databases",
      target: "_blank",

      text: "Databases A-Z list",
    }));
    azLine.appendChild(document.createTextNode("."));
    fallback.appendChild(azLine);

    const helpLine = el("div");
    helpLine.appendChild(document.createTextNode("Need help from a person? Reach out through the "));
    helpLine.appendChild(el("a", {

      target: "_blank",

  function renderAssistantTextBubble(text) {
    messagesEl.appendChild(el("div", { className: "bubble assistant", text }));

  function applyKindUI() {
    const kind = currentKind();
    const cfg = KINDS[kind];
    appTitleEl.textContent = cfg.title;
    appSubtitleEl.textContent = cfg.subtitle;
    document.title = cfg.title;
    inputEl.placeholder = cfg.placeholder;
    modeDatabaseBtn.classList.toggle("active", kind === "database");
    modeOaBtn.classList.toggle("active", kind === "oa");
    modeDatabaseBtn.setAttribute("aria-pressed", String(kind === "database"));
    modeOaBtn.setAttribute("aria-pressed", String(kind === "oa"));
  }

  // ── Open Access journal results ────────────────────────────────────────────
  function fmtMoney(n, cur) {
    try {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: cur || "USD", maximumFractionDigits: 0 }).format(n);
    } catch {
      return `${cur || ""} ${Math.round(n).toLocaleString("en-US")}`.trim();
    }
  }

  function costSummary(c) {
    const list = c.list_apc, cur = c.currency;
    switch (c.benefit_type) {
      case "waived":
        return {
          label: c.capped ? "APC waived (capped agreement)" : "APC waived",
          tone: "good",
          line: list != null
            ? `List APC ${fmtMoney(list, cur)} → ${fmtMoney(0, cur)} with the Vanderbilt agreement${c.capped ? ", while capped funds last" : ""}.`
            : "APC waived with the Vanderbilt agreement.",
        };
      case "discount":
        return {
          label: `${c.discount_pct}% APC discount`,
          tone: "ok",
          line: list != null && c.price_with_agreement != null
            ? `List APC ${fmtMoney(list, cur)} → about ${fmtMoney(c.price_with_agreement, cur)} after the ${c.discount_pct}% discount.`
            : `${c.discount_pct}% discount on the APC.`,
        };
      case "allocated_out":
        return {
          label: "Waivers fully allocated",
          tone: "warn",
          line: (list != null ? `List APC ${fmtMoney(list, cur)}. ` : "") +
                "This year's waiver funds for this publisher are fully allocated, so confirm availability before submitting.",
        };
      default:
        return {
          label: c.benefit || "No benefit listed",
          tone: "none",
          line: list != null ? `List APC ${fmtMoney(list, cur)}.` : "",
        };
    }
  }

  function metricsLine(m) {
    const parts = [];
    if (m.sjr != null) parts.push(`SJR ${m.sjr}${m.quartile ? ` (Q${m.quartile})` : ""}`);
    else if (m.quartile) parts.push(`SJR quartile Q${m.quartile}`);
    if (m.h_index != null) parts.push(`h-index ${m.h_index}`);
    if (m.citedness != null) parts.push(`2-yr mean citedness ${m.citedness}`);
    return parts.join(" · ") || "Impact metrics not available";
  }

  function renderJournalCard(j, i) {
    const badge = el("span", { className: "badge", text: String(i + 1) });
    const nameNode = el("a", {
      className: "card-name", href: j.finder_url, target: "_blank", rel: "noopener noreferrer", text: j.name,
    });
    nameNode.appendChild(el("span", { className: "ext", text: "↗" }));
    const head = el("div", { className: "card-head" }, badge, nameNode);

    const meta = el("div", { className: "card-desc", text: [j.publisher, j.oa_model].filter(Boolean).join(" · ") });

    const cs = costSummary(j.cost);
    const badges = el("div", { className: "oa-badges" }, el("span", { className: `oa-badge ${cs.tone}`, text: cs.label }));

    const parts = [head, meta, badges];
    if (cs.line) parts.push(el("div", { className: "oa-fact", text: cs.line }));
    parts.push(el("div", { className: "oa-fact", text: metricsLine(j.metrics) }));
    if ((j.subjects || []).length) parts.push(el("div", { className: "oa-fact muted", text: "Subjects: " + j.subjects.join(", ") }));
    if (j.why) parts.push(el("div", { className: "card-why", text: j.why }));

    const actions = el("div", { className: "actions" });
    actions.appendChild(el("a", { className: "action-btn", href: j.finder_url, target: "_blank", rel: "noopener noreferrer", text: "View in Open Journal Finder" }));
    const home = safeHttpUrl(j.homepage);
    if (home) actions.appendChild(el("a", { className: "action-btn secondary", href: home, target: "_blank", rel: "noopener noreferrer", text: "Journal website" }));
    parts.push(actions);

    return el("div", { className: "card" }, ...parts);
  }

  function renderOaFooter(payload) {
    const f = el("div", { className: "fallback-link" });
    const l1 = el("div");
    l1.appendChild(document.createTextNode("Browse and filter every journal with a Vanderbilt agreement in the "));
    l1.appendChild(el("a", { href: safeHttpUrl(payload.finder_search_url) || OPEN_JOURNAL_FINDER_URL, target: "_blank", rel: "noopener noreferrer", text: "Open Journal Finder" }));
    l1.appendChild(document.createTextNode("."));
    f.appendChild(l1);
    const l2 = el("div");
    l2.appendChild(document.createTextNode("Check eligibility and agreement terms in the "));
    l2.appendChild(el("a", { href: AUTHOR_SERVICES_URL, target: "_blank", rel: "noopener noreferrer", text: "Vanderbilt Open Author Services guide" }));
    l2.appendChild(document.createTextNode("."));
    f.appendChild(l2);
    f.appendChild(el("div", {
      className: "oa-disclaimer",
      text: "Impact is shown as SJR, SJR quartile, h-index and 2-year mean citedness, not Clarivate impact factors, and acceptance rates are not available. The explanations are AI-generated: confirm a journal's scope, fees and your eligibility before submitting.",
    }));
    return f;
  }

  function renderOaResult(payload) {
    const wrap = el("div", { className: "result-set" });
    if (payload.intro) {
      const eq = el("div", { className: "enhanced-query" });
      eq.appendChild(el("span", { className: "label", text: "Matching summary" }));
      eq.appendChild(document.createTextNode(payload.intro));
      wrap.appendChild(eq);
    }
    for (const note of (payload.notes || [])) wrap.appendChild(el("div", { className: "oa-note", text: note }));
    (payload.journals || []).forEach((j, i) => wrap.appendChild(renderJournalCard(j, i)));
    wrap.appendChild(renderOaFooter(payload));
    messagesEl.appendChild(wrap);
  }

  function renderActiveChat() {
    applyKindUI();
    messagesEl.innerHTML = "";
    const chat = activeChat();
    if (!chat || chat.turns.length === 0) {
      renderWelcome();
      return;
    }
    for (const turn of chat.turns) {
      if (turn.role === "user") {
        renderUserBubble(turn.text);
      } else if (turn.mode === "oa") {
        renderOaResult(turn.payload || {});
      } else if (turn.mode === "chat") {
        renderAssistantTextBubble(turn.text || "");
        if (turn.finder_search_url) {
          const f = el("div", { className: "fallback-link" });
          f.appendChild(el("a", { href: safeHttpUrl(turn.finder_search_url) || OPEN_JOURNAL_FINDER_URL, target: "_blank", rel: "noopener noreferrer", text: "Search the Open Journal Finder" }));
          messagesEl.appendChild(f);
        }
      } else {
        // Research mode, or legacy turns without a mode field.
        renderResultSet(turn.payload || {});
      }
    }
    scrollBottom();
  }

  // ── Export / share / print ─────────────────────────────────────────────────
  function chatToMarkdown(chat) {
    const lines = [`# ${chat.title}`, ""];
    for (const turn of chat.turns) {
      if (turn.role === "user") {
        lines.push(`**You:** ${turn.text}`, "");
      } else if (turn.mode === "chat") {
        lines.push(`**Assistant:** ${turn.text || ""}`, "");
      } else if (turn.mode === "oa") {
        const payload = turn.payload || {};
        if (payload.intro) lines.push(`**Matching summary:** ${payload.intro}`, "");
        for (const note of (payload.notes || [])) lines.push(`> ${note}`, "");
        (payload.journals || []).forEach((j, i) => {
          const cs = costSummary(j.cost);
          lines.push(`${i + 1}. **${j.name}** (${j.publisher})`);
          if (j.why) lines.push(`   - Why it fits: ${j.why}`);
          lines.push(`   - ${j.oa_model}; ${cs.label}${cs.line ? ` - ${cs.line}` : ""}`);
          lines.push(`   - ${metricsLine(j.metrics)}`);
          lines.push(`   - Open Journal Finder: ${j.finder_url}`);
          lines.push("");
        });
        lines.push(`Open Journal Finder: ${OPEN_JOURNAL_FINDER_URL}`, `Vanderbilt Open Author Services guide: ${AUTHOR_SERVICES_URL}`, "");
      } else {
        const payload = turn.payload || {};
        if (payload.enhanced_query) {
          lines.push(`**Interpreted query:** ${payload.enhanced_query}`, "");
        }
        (payload.recommendations || []).forEach((rec, i) => {
          lines.push(`${i + 1}. **${rec.name}**`);
          if (rec.refined_description) lines.push(`   - ${rec.refined_description}`);
          if (rec.why_it_fits)         lines.push(`   - Why it fits: ${rec.why_it_fits}`);
          if (rec.search_string)       lines.push(`   - Search string: \`${rec.search_string}\``);
          if (rec.direct_url)          lines.push(`   - Database: ${rec.direct_url}`);
          if (rec.primo_search_url)    lines.push(`   - Search in Primo: ${rec.primo_search_url}`);
          lines.push("");
        });
        if ((payload.librarians || []).length) {
          lines.push("**Ask a Librarian**", "");
          for (const p of payload.librarians) {
            const where = p.office || p.unit;
            lines.push(`- ${p.name}, ${p.title} — ${[p.email, p.phone, where].filter(Boolean).join(" | ")}`);
          }
          lines.push("");
        }
      }
    }
    lines.push("---", `Generated by the ${KINDS[kindOf(chat)].title}.`);
    return lines.join("\n");
  }

  function setExportMenu(open) {
    exportDropdownEl.hidden = !open;
    exportBtn.setAttribute("aria-expanded", String(open));
  }

  async function copyPlanAsMarkdown() {
    const chat = activeChat();
    if (!chat || chat.turns.length === 0) return;
    const original = "Export ▾";
    try {
      await navigator.clipboard.writeText(chatToMarkdown(chat));
      exportBtn.textContent = "Copied!";
    } catch {
      exportBtn.textContent = "Copy failed";
    }
    setTimeout(() => { exportBtn.textContent = original; }, 1500);
  }

  function downloadPlanAsMarkdown() {
    const chat = activeChat();
    if (!chat || chat.turns.length === 0) return;
    const blob = new Blob([chatToMarkdown(chat)], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(chat.title || "research-plan").replace(/[^\w\- ]/g, "").trim() || "research-plan"}.md`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  exportBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setExportMenu(exportDropdownEl.hidden);
  });
  exportCopyBtn.addEventListener("click", () => { setExportMenu(false); copyPlanAsMarkdown(); });
  exportDownloadBtn.addEventListener("click", () => { setExportMenu(false); downloadPlanAsMarkdown(); });
  exportPrintBtn.addEventListener("click", () => { setExportMenu(false); window.print(); });
  document.addEventListener("click", (e) => {
    if (!exportMenuEl.contains(e.target)) setExportMenu(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !exportDropdownEl.hidden) { setExportMenu(false); exportBtn.focus(); }
  });

  // ── Chat operations ────────────────────────────────────────────────────────
  function switchToChat(id) {
    if (store.active_id === id) return;
    store.active_id = id;
    saveStore();
    renderChatList();
    renderActiveChat();
    closeSidebarMobile();
  }

  function switchKind(kind) {
    const current = activeChat();
    if (current && kindOf(current) === kind) return;
    // Don't leave an empty placeholder chat behind when switching away.
    if (current && current.turns.length === 0) delete store.chats[current.id];
    const existing = sortedChats().find(c => kindOf(c) === kind);
    if (existing) { store.active_id = existing.id; saveStore(); }
    else createChat(kind);
    renderChatList();
    renderActiveChat();
    inputEl.focus();
    closeSidebarMobile();
  }

  modeDatabaseBtn.addEventListener("click", () => switchKind("database"));
  modeOaBtn.addEventListener("click", () => switchKind("oa"));

  function createChatAndSwitch() {
    createChat();
    renderChatList();
    renderActiveChat();
    inputEl.focus();
    closeSidebarMobile();
  }

  // ── Sidebar mobile toggle ──────────────────────────────────────────────────
  function openSidebarMobile()  { appEl.classList.add("sidebar-open"); }
  function closeSidebarMobile() { appEl.classList.remove("sidebar-open"); }
  function toggleSidebarMobile() { appEl.classList.toggle("sidebar-open"); }

  hamburgerBtn.addEventListener("click", toggleSidebarMobile);
  backdropEl.addEventListener("click", closeSidebarMobile);
  newChatBtn.addEventListener("click", createChatAndSwitch);
  sendBtn.addEventListener("click", sendMessage);

  // ── Input handling ─────────────────────────────────────────────────────────
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Send message ───────────────────────────────────────────────────────────
  function appendError(msg) {
    messagesEl.appendChild(el("div", { className: "error-banner", text: msg }));
    scrollBottom();
  }

  function appendTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  async function runOaTurn(chat, firstMessage, typing) {
    try {
      const res = await fetch(`${BACKEND_URL}/oa/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages(chat) }),
      });
      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error(`Server returned ${res.status}${body ? `: ${body.slice(0, 200)}` : ""}`);
      }
      const payload = await res.json();
      typing.remove();

      if (payload.mode === "oa") {
        renderOaResult(payload);
        chat.turns.push({ role: "assistant", mode: "oa", payload, raw_assistant_message: payload.raw_assistant_message });
      } else {
        const text = payload.text || "";
        renderAssistantTextBubble(text);
        const turn = { role: "assistant", mode: "chat", text, raw_assistant_message: payload.raw_assistant_message };
        if (payload.finder_search_url) {
          turn.finder_search_url = payload.finder_search_url;
          const f = el("div", { className: "fallback-link" });
          f.appendChild(el("a", { href: safeHttpUrl(payload.finder_search_url) || OPEN_JOURNAL_FINDER_URL, target: "_blank", rel: "noopener noreferrer", text: "Search the Open Journal Finder" }));
          messagesEl.appendChild(f);
        }
        chat.turns.push(turn);
      }
      scrollBottom();
      chat.updated_at = Date.now();
      saveStore();
      renderChatList();
    } catch (err) {
      typing.remove();
      appendError(`Something went wrong: ${err.message}. The server may be waking up from sleep — please wait a moment and try again.`);
      chat.turns.pop();
      if (firstMessage) chat.title = "New chat";
      saveStore();
      renderChatList();
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    const chat = ensureActiveChat();
    const firstMessage = chat.turns.length === 0;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    // Remove welcome card if it's still there
    const welcomeEl = messagesEl.querySelector(".welcome");
    if (welcomeEl) welcomeEl.remove();

    // Optimistically append user bubble
    renderUserBubble(text);
    chat.turns.push({ role: "user", text });
    chat.updated_at = Date.now();
    if (firstMessage) chat.title = autoTitleFrom(text);
    saveStore();
    renderChatList();
    scrollBottom();

    const typing = appendTyping();

    if (kindOf(chat) === "oa") {
      await runOaTurn(chat, firstMessage, typing);
      sendBtn.disabled = false;
      inputEl.focus();
      return;
    }

    let liveBubble = null; // created lazily on the first streamed delta

    try {
      const res = await fetch(`${BACKEND_URL}/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages(chat) }),
      });

      if (!res.ok || !res.body) {
        const body = await res.text().catch(() => "");
        throw new Error(`Server returned ${res.status}${body ? `: ${body.slice(0, 200)}` : ""}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let finalPayload = null;
      let streamError = null;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        let sepIdx;
        while ((sepIdx = buf.indexOf("\n\n")) !== -1) {
          const rawEvent = buf.slice(0, sepIdx).trim();
          buf = buf.slice(sepIdx + 2);
          if (!rawEvent.startsWith("data:")) continue;

          let evt;
          try {
            evt = JSON.parse(rawEvent.slice(5).trim());
          } catch {
            continue; // ignore any malformed line rather than aborting the whole stream
          }

          if (evt.type === "delta") {
            if (!liveBubble) {
              typing.remove();
              liveBubble = el("div", { className: "bubble assistant" });
              messagesEl.appendChild(liveBubble);
            }
            liveBubble.textContent += evt.text;
            scrollBottom();
          } else if (evt.type === "final") {
            finalPayload = evt;
          } else if (evt.type === "error") {
            streamError = evt.error || "Unknown error";
          }
        }
      }

      typing.remove();
      if (streamError) throw new Error(streamError);
      if (!finalPayload) throw new Error("No response received from the server.");

      if (finalPayload.mode === "chat") {
        const finalText = finalPayload.text || "";
        if (liveBubble) {
          liveBubble.textContent = finalText; // authoritative text wins over any partial-stream drift
        } else {
          renderAssistantTextBubble(finalText);
        }
        chat.turns.push({
          role: "assistant",
          mode: "chat",
          text: finalText,
          raw_assistant_message: finalPayload.raw_assistant_message,
        });
      } else {
        if (liveBubble) liveBubble.remove();
        renderResultSet(finalPayload);
        chat.turns.push({
          role: "assistant",
          mode: "research",
          payload: finalPayload,
          raw_assistant_message: finalPayload.raw_assistant_message,
        });
      }

      scrollBottom();
      chat.updated_at = Date.now();
      saveStore();
      renderChatList();

    } catch (err) {
      typing.remove();
      if (liveBubble) liveBubble.remove();
      appendError(`Something went wrong: ${err.message}. The server may be waking up from sleep — please wait a moment and try again.`);
      // Roll back the optimistic user turn since we got no usable response.
      chat.turns.pop();
      if (firstMessage) chat.title = "New chat";
      saveStore();
      renderChatList();
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  ensureActiveChat();
  renderChatList();
  renderActiveChat();
  inputEl.focus();
</script>
